<style>
        body {
            background-color: #0D0D0C;
            color: #F2F2F0;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .sunken-input {
            background-color: #090908;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sunken-input:focus-within {
            box-shadow: 0 0 0 2px #E8550F;
        }
        .baze-animation {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .baze-animation:active {
            transform: scale(0.95);
        }
    </style>

<body class="flex items-center justify-center min-h-screen p-space-6">
<!-- Main Registration Container -->
<main class="w-full max-w-[420px] flex flex-col items-center">
<!-- Brand Logo Header -->
<header class="mb-space-10 flex flex-col items-center">
<div class="w-20 h-20 mb-space-6">
<img alt="NzolaNet Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLu1Bcj4N5DFnCKBO-WmtZVj2ExymgP6b4DjSvHb0EdbJnG-sRPZdUdosvw6feSm3qd4GxN6rL9SIqvsH25-8HUTNutVBiRM8AbPC7q8z-C45TMgeamIC55CMmii3WI2q_Xm0qi7KMNObtzI0loCBhIudBCPAXXShfwR3CqCYLIsUYPGhQ59yy5rnNnGjDcx24nYbrGBVKcuGdeTTaHVmsHyabrFuw4uhtsrdRREIeKhMlMVZpe0DsQKkw"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-text-primary mb-space-2">Criar conta</h1>
<p class="font-body-sm text-body-sm text-text-secondary">Junte-se à comunidade NzolaNet hoje.</p>
</header>
<!-- Form Section -->
<section class="w-full">
<form class="flex flex-col gap-space-5" id="registrationForm">
<!-- Full Name Field -->
<div class="flex flex-col gap-space-2">
<label class="font-label-md text-label-md text-text-secondary px-space-1" for="fullName">Nome completo</label>
<div class="sunken-input group flex items-center rounded-xl border border-border-subtle p-space-3">
<span class="material-symbols-outlined text-text-tertiary mr-space-3">person</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md text-body-md text-text-primary placeholder:text-text-tertiary" id="fullName" name="fullName" placeholder="Ex: João Silva" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-space-2">
<label class="font-label-md text-label-md text-text-secondary px-space-1" for="email">Email</label>
<div class="sunken-input group flex items-center rounded-xl border border-border-subtle p-space-3">
<span class="material-symbols-outlined text-text-tertiary mr-space-3">mail</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md text-body-md text-text-primary placeholder:text-text-tertiary" id="email" name="email" placeholder="nome@exemplo.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-2">
<label class="font-label-md text-label-md text-text-secondary px-space-1" for="password">Palavra-passe</label>
<div class="sunken-input group flex items-center rounded-xl border border-border-subtle p-space-3 relative">
<span class="material-symbols-outlined text-text-tertiary mr-space-3">lock</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md text-body-md text-text-primary placeholder:text-text-tertiary pr-10" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-space-3 text-text-tertiary hover:text-text-secondary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passwordIcon">visibility</span>
</button>
</div>
<p class="font-caption text-caption text-text-tertiary px-space-1">Mínimo de 8 caracteres.</p>
</div>
<!-- Submit Button -->
<button class="baze-animation bg-sunset-orange hover:bg-primary-container text-white rounded-full py-space-4 px-space-6 mt-space-4 font-headline-sm text-headline-sm shadow-lg shadow-sunset-orange/10 transition-all duration-200" type="submit">
                    Continuar
                </button>
</form>
</section>
<!-- Footer -->
<footer class="mt-space-8 text-center">
<p class="font-body-sm text-body-sm text-text-secondary">
                Já tem uma conta? 
                <a class="text-sunset-orange hover:underline font-headline-sm text-headline-sm transition-all" href="#">Entrar</a>
</p>
<div class="mt-space-10 flex gap-space-4 justify-center opacity-40">
<a class="font-label-sm text-label-sm hover:opacity-100 transition-opacity" href="#">Termos</a>
<a class="font-label-sm text-label-sm hover:opacity-100 transition-opacity" href="#">Privacidade</a>
<a class="font-label-sm text-label-sm hover:opacity-100 transition-opacity" href="#">Cookies</a>
</div>
</footer>
</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                passwordIcon.innerText = 'visibility';
            }
        }

        // Lightweight atmospheric effect: subtle focus glow tracking
        document.addEventListener('mousemove', (e) => {
            const form = document.getElementById('registrationForm');
            const rect = form.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // We could apply a dynamic subtle gradient here if needed, 
            // but for "sharp focus on hierarchy" we'll keep it minimal.
        });

        document.getElementById('registrationForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'A processar...';
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            
            // Simulating a fast transition
            setTimeout(() => {
                alert('Bem-vindo à NzolaNet! A sua conta foi criada com sucesso.');
                btn.innerText = originalText;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
            }, 1000);
        });
    </script>
</body></html>
