<script>
        // Simple theme toggle logic for visual demonstration
        const toggleBtn = document.getElementById('theme-toggle');
        const toggleKnob = document.getElementById('theme-toggle-knob');
        const htmlTag = document.documentElement;
        const iconContainer = document.getElementById('appearance-icon-container');
        const icon = document.getElementById('appearance-icon');

        toggleBtn.addEventListener('click', () => {
            const isDark = htmlTag.classList.contains('dark');
            
            if (isDark) {
                htmlTag.classList.remove('dark');
                // Update toggle visual state to OFF (Light Mode)
                toggleBtn.classList.remove('bg-sunset-orange');
                toggleBtn.classList.add('bg-surface-container-high');
                toggleKnob.classList.remove('translate-x-6', 'bg-text-primary');
                toggleKnob.classList.add('translate-x-0', 'bg-text-secondary');
                
                // Update icon
                icon.textContent = 'light_mode';
                iconContainer.classList.add('text-sunset-orange', 'bg-sunset-orange/10');
                iconContainer.classList.remove('text-text-secondary');
            } else {
                htmlTag.classList.add('dark');
                // Update toggle visual state to ON (Dark Mode)
                toggleBtn.classList.add('bg-sunset-orange');
                toggleBtn.classList.remove('bg-surface-container-high');
                toggleKnob.classList.add('translate-x-6', 'bg-text-primary');
                toggleKnob.classList.remove('translate-x-0', 'bg-text-secondary');
                
                // Update icon
                icon.textContent = 'dark_mode';
                iconContainer.classList.remove('text-sunset-orange', 'bg-sunset-orange/10');
                iconContainer.classList.add('text-text-secondary');
            }
        });
    </script>
