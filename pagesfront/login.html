<style>
        body {
            background-color: #0D0D0C; /* Using bg-base hex for solid background */
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }

        .baze-transition {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .sunken-input {
            background-color: #090908; /* bg-sunken */
            border: 1px solid #1F1F1D; /* border-subtle */
        }

        .sunken-input:focus {
            outline: none;
            border-color: #E8550F; /* sunset-orange */
            box-shadow: 0 0 0 2px rgba(232, 85, 15, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-space-6 selection:bg-sunset-orange selection:text-white">
<!-- Login Container -->
<main class="w-full max-w-[420px] flex flex-col items-center">
<!-- Logo Section -->
<header class="mb-space-10 flex flex-col items-center">
<div class="w-16 h-16 mb-space-5">
<img alt="NzolaNet Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLu1Bcj4N5DFnCKBO-WmtZVj2ExymgP6b4DjSvHb0EdbJnG-sRPZdUdosvw6feSm3qd4GxN6rL9SIqvsH25-8HUTNutVBiRM8AbPC7q8z-C45TMgeamIC55CMmii3WI2q_Xm0qi7KMNObtzI0loCBhIudBCPAXXShfwR3CqCYLIsUYPGhQ59yy5rnNnGjDcx24nYbrGBVKcuGdeTTaHVmsHyabrFuw4uhtsrdRREIeKhMlMVZpe0DsQKkw"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-text-primary tracking-tight">
                Bem-vindo de volta
            </h1>
<p class="font-body-sm text-text-secondary mt-space-2">
                Conecte-se com sua rede no NzolaNet
            </p>
</header>
<!-- Form Section -->
<section class="w-full space-y-space-6">
<form action="#" class="space-y-space-5" method="POST">
<!-- Email Field -->
<div class="space-y-space-2">
<label class="font-label-sm text-label-sm text-text-secondary ml-space-1" for="email">
                        E-mail
                    </label>
<input class="w-full h-12 px-space-4 rounded-xl sunken-input text-text-primary font-body-md placeholder:text-text-tertiary transition-all duration-200" id="email" name="email" placeholder="nome@exemplo.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-space-2">
<div class="flex justify-between items-center px-space-1">
<label class="font-label-sm text-label-sm text-text-secondary" for="password">
                            Senha
                        </label>
<a class="font-label-sm text-label-sm text-sunset-orange hover:brightness-110 transition-all" href="#">
                            Esqueceu a senha?
                        </a>
</div>
<div class="relative group">
<input class="w-full h-12 px-space-4 rounded-xl sunken-input text-text-primary font-body-md placeholder:text-text-tertiary transition-all duration-200" id="password" name="password" placeholder="Sua senha" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-sunset-orange text-white font-headline-sm text-headline-sm rounded-xl baze-transition hover:translate-y-[-1px] hover:shadow-[0_8px_16px_rgba(232,85,15,0.2)] active:scale-95 mt-space-3" type="submit">
                    Entrar
                </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-space-2">
<div class="flex-grow border-t border-border-subtle"></div>
<span class="flex-shrink mx-space-4 font-caption text-text-tertiary">ou continue com</span>
<div class="flex-grow border-t border-border-subtle"></div>
</div>
<!-- Secondary Actions (Account Creation) -->
<div class="text-center">
<p class="font-body-sm text-text-secondary">
                    Não tem uma conta? 
                    <a class="font-headline-sm text-headline-sm text-sunset-orange hover:underline decoration-sunset-orange/30 underline-offset-4 ml-space-1 transition-all" href="#">
                        Criar conta
                    </a>
</p>
</div>
</section>
<!-- Footer Info -->
<footer class="mt-space-10 pt-space-10 border-t border-border-subtle w-full text-center">
<nav class="flex flex-wrap justify-center gap-space-4 mb-space-4">
<a class="font-caption text-text-tertiary hover:text-text-secondary transition-colors" href="#">Termos</a>
<a class="font-caption text-text-tertiary hover:text-text-secondary transition-colors" href="#">Privacidade</a>
<a class="font-caption text-text-tertiary hover:text-text-secondary transition-colors" href="#">Cookies</a>
</nav>
<p class="font-caption text-text-tertiary/50">
                © 2024 NzolaNet. Feito com afeto.
            </p>
</footer>
</main>
<script>
        // Simple micro-interaction for the submit button
        const loginBtn = document.querySelector('button[type="submit"]');
        loginBtn.addEventListener('click', (e) => {
            // Check form validity before adding effect
            const form = document.querySelector('form');
            if (form.checkValidity()) {
                loginBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            }
        });

        // Toggle focus state visual cues via Javascript for refined feel
        const inputs = document.querySelectorAll('.sunken-input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.add('text-sunset-orange');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').classList.remove('text-sunset-orange');
            });
        });
    </script>
</body></html>
