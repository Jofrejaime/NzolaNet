<div class="login-wrap min-h-screen flex">

  <!-- Painel esquerdo -->
  <div class="left-panel hidden lg:flex flex-col justify-between p-10 w-[45%] flex-shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-lg bg-[var(--bg-brand)] flex items-center justify-center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      <span class="text-xl font-extrabold text-[var(--text-brand)]">NzolaNet</span>
    </div>
    <div class="flex items-center justify-center flex-1 py-10">
      <div class="illustration-box w-[240px] h-[240px] rounded-2xl flex items-center justify-center">
        <svg width="140" height="120" viewBox="0 0 140 120" fill="none">
          <circle cx="70" cy="52" r="18" fill="#E8A870"/>
          <path d="M40 110c0-16.569 13.431-30 30-30s30 13.431 30 30" fill="#E8A870"/>
          <circle cx="28" cy="44" r="14" fill="#D4915A"/>
          <path d="M4 96c0-13.255 10.745-24 24-24s24 10.745 24 24" fill="#D4915A"/>
          <circle cx="112" cy="44" r="14" fill="#D4915A"/>
          <path d="M88 96c0-13.255 10.745-24 24-24s24 10.745 24 24" fill="#D4915A"/>
        </svg>
      </div>
    </div>
    <div></div>
  </div>

  <!-- Painel direito -->
  <div class="flex flex-1 items-center justify-center px-6 py-12">
    <div class="w-full max-w-[500px]">

      <!-- Logo mobile -->
      <div class="flex items-center justify-center gap-2 mb-8 lg:hidden">
        <div class="w-9 h-9 rounded-lg bg-[var(--bg-brand)] flex items-center justify-center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          </svg>
        </div>
        <span class="text-xl font-extrabold text-[var(--text-brand)]">NzolaNet</span>
      </div>

      <!-- Card -->
      <div class="bg-[var(--bg-surface)] border border-[var(--border-default)] rounded-2xl p-8">

        <!-- Título -->
        <div class="text-center mb-6">
          <h1 class="text-xl font-bold text-[var(--text-primary)] mb-1">Bem-vindo de volta</h1>
          <p class="text-sm text-[var(--text-secondary)]">Entra na tua conta para continuar</p>
        </div>

        <!-- Tabs -->
        <div class="flex bg-[var(--bg-elevated)] rounded-lg p-1 mb-6">
          <button
            class="tab-btn flex-1 py-2 text-sm font-semibold rounded-md transition"
            [class.active]="activeTab === 'entrar'"
            (click)="activeTab = 'entrar'">
            Entrar
          </button>
          <button
            class="tab-btn flex-1 py-2 text-sm font-semibold rounded-md transition"
            [class.active]="activeTab === 'criar'"
            (click)="activeTab = 'criar'">
            Criar conta
          </button>
        </div>

        <!-- FORM: ENTRAR -->
        @if (activeTab === 'entrar') {
          <div class="flex flex-col gap-3">
            <div class="input-wrap flex items-center gap-3 bg-[var(--bg-elevated)] border border-[var(--border-default)] rounded-lg px-4 py-3 focus-within:border-[var(--border-brand)] transition">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[var(--text-tertiary)] flex-shrink-0"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" placeholder="Email ou nome de utilizador" class="flex-1 bg-transparent border-none outline-none text-sm text-[var(--text-primary)] placeholder:text-[var(--text-tertiary)]"/>
            </div>
            <div class="input-wrap flex items-center gap-3 bg-[var(--bg-elevated)] border border-[var(--border-default)] rounded-lg px-4 py-3 focus-within:border-[var(--border-brand)] transition">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[var(--text-tertiary)] flex-shrink-0"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" placeholder="Palavra-passe" class="flex-1 bg-transparent border-none outline-none text-sm text-[var(--text-primary)] placeholder:text-[var(--text-tertiary)]"/>
              <button class="text-[var(--text-tertiary)] hover:text-[var(--text-secondary)] transition flex-shrink-0">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="flex justify-end">
              <button class="text-xs text-[var(--text-brand)] hover:underline">Esqueceste a palavra-passe?</button>
            </div>
            <button (click)="login()" class="w-full flex items-center justify-center gap-2 bg-[var(--bg-brand)] text-white py-3 rounded-lg font-bold text-sm hover:bg-[#C9460A] transition-all hover:scale-[1.01] active:scale-[0.99] mt-1">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
              Entrar
            </button>
          </div>
        }

        <!-- FORM: CRIAR CONTA -->
        @if (activeTab === 'criar') {
          <div class="flex flex-col gap-3">

            <!-- Nome + Apelido -->
            <div class="flex gap-3">
              <div class="input-wrap flex items-center gap-2 flex-1 bg-[var(--bg-elevated)] border border-[var(--border-default)] rounded-lg px-3 py-3 focus-within:border-[var(--border-brand)] transition">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[var(--text-tertiary)] flex-shrink-0"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <input type="text" placeholder="Nome" class="flex-1 min-w-0 bg-transparent border-none outline-none text-sm text-[var(--text-primary)] placeholder:text-[var(--text-tertiary)]"/>
              </div>
              <div class="input-wrap flex items-center gap-2 flex-1 bg-[var(--bg-elevated)] border border-[var(--border-default)] rounded-lg px-3 py-3 focus-within:border-[var(--border-brand)] transition">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[var(--text-tertiary)] flex-shrink-0"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <input type="text" placeholder="Apelido" class="flex-1 min-w-0 bg-transparent border-none outline-none text-sm text-[var(--text-primary)] placeholder:text-[var(--text-tertiary)]"/>
              </div>
            </div>

            <!-- Email -->
            <div class="input-wrap flex items-center gap-3 bg-[var(--bg-elevated)] border border-[var(--border-default)] rounded-lg px-4 py-3 focus-within:border-[var(--border-brand)] transition">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[var(--text-tertiary)] flex-shrink-0"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" placeholder="Email" class="flex-1 bg-transparent border-none outline-none text-sm text-[var(--text-primary)] placeholder:text-[var(--text-tertiary)]"/>
            </div>

            <!-- Telefone -->
            <div class="input-wrap flex items-center gap-3 bg-[var(--bg-elevated)] border border-[var(--border-default)] rounded-lg px-4 py-3 focus-within:border-[var(--border-brand)] transition">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[var(--text-tertiary)] flex-shrink-0"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.18 6.18l1.27-.85a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              <input type="tel" placeholder="Telefone" class="flex-1 bg-transparent border-none outline-none text-sm text-[var(--text-primary)] placeholder:text-[var(--text-tertiary)]"/>
            </div>

            <!-- Data de nascimento -->
            <div class="input-wrap flex items-center gap-3 bg-[var(--bg-elevated)] border border-[var(--border-default)] rounded-lg px-4 py-3 focus-within:border-[var(--border-brand)] transition">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[var(--text-tertiary)] flex-shrink-0"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <input type="date" placeholder="dd/mm/aaaa" class="flex-1 bg-transparent border-none outline-none text-sm text-[var(--text-tertiary)] placeholder:text-[var(--text-tertiary)] date-input"/>
            </div>

            <!-- Género -->
            <div class="input-wrap flex items-center gap-3 bg-[var(--bg-elevated)] border border-[var(--border-default)] rounded-lg px-4 py-3 focus-within:border-[var(--border-brand)] transition">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[var(--text-tertiary)] flex-shrink-0"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41"/></svg>
              <select class="flex-1 bg-transparent border-none outline-none text-sm text-[var(--text-tertiary)] cursor-pointer appearance-none">
                <option value="" disabled selected class="bg-[var(--bg-elevated)]">Seleciona o género</option>
                <option value="m" class="bg-[var(--bg-elevated)] text-[var(--text-primary)]">Masculino</option>
                <option value="f" class="bg-[var(--bg-elevated)] text-[var(--text-primary)]">Feminino</option>
                <option value="o" class="bg-[var(--bg-elevated)] text-[var(--text-primary)]">Outro</option>
                <option value="n" class="bg-[var(--bg-elevated)] text-[var(--text-primary)]">Prefiro não dizer</option>
              </select>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-[var(--text-tertiary)] flex-shrink-0 pointer-events-none"><polyline points="6 9 12 15 18 9"/></svg>
            </div>

            <!-- Palavra-passe -->
            <div class="input-wrap flex items-center gap-3 bg-[var(--bg-elevated)] border border-[var(--border-default)] rounded-lg px-4 py-3 focus-within:border-[var(--border-brand)] transition">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[var(--text-tertiary)] flex-shrink-0"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" placeholder="Palavra-passe" class="flex-1 bg-transparent border-none outline-none text-sm text-[var(--text-primary)] placeholder:text-[var(--text-tertiary)]"/>
            </div>

            <!-- Termos -->
            <label class="flex items-start gap-2 cursor-pointer mt-1">
              <input type="checkbox" class="mt-0.5 accent-[var(--bg-brand)] flex-shrink-0"/>
              <span class="text-xs text-[var(--text-secondary)] leading-relaxed">
                Aceito os <a href="#" class="text-[var(--text-brand)] hover:underline">Termos de Serviço</a> e a <a href="#" class="text-[var(--text-brand)] hover:underline">Política de Privacidade</a> do NzolaNet.
              </span>
            </label>

            <!-- Botão Criar conta -->
            <button (click)="register()" class="w-full flex items-center justify-center gap-2 bg-[var(--bg-brand)] text-white py-3 rounded-lg font-bold text-sm hover:bg-[#C9460A] transition-all hover:scale-[1.01] active:scale-[0.99] mt-1">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
              Criar conta
            </button>

            <!-- Divisor -->
            <div class="flex items-center gap-3 my-1">
              <div class="flex-1 h-px bg-[var(--border-default)]"></div>
              <span class="text-xs text-[var(--text-tertiary)]">ou</span>
              <div class="flex-1 h-px bg-[var(--border-default)]"></div>
            </div>

            <!-- Já tens conta -->
            <button (click)="activeTab = 'entrar'" class="w-full border border-[var(--border-default)] text-[var(--text-primary)] py-3 rounded-lg font-semibold text-sm hover:bg-[var(--state-hover)] hover:border-[var(--border-strong)] transition">
              Entrar
            </button>

          </div>
        }

      </div>

      <!-- Footer -->
      <div class="text-center mt-6 text-xs text-[var(--text-tertiary)]">
        © 2024 NzolaNet · <a href="#" class="hover:underline">Privacidade</a> · <a href="#" class="hover:underline">Termos</a> · <a href="#" class="hover:underline">Ajuda</a>
      </div>

    </div>
  </div>

</div>
