<div class="settings-page">
  <div class="settings-header">
    <button class="back-btn" (click)="goBack()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <h1>Informação da conta</h1>
    <button class="save-btn" (click)="saveChanges()" [class.loading]="isLoading()">
      @if (isLoading()) {
        <svg class="spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
          <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/>
        </svg>
      }
      <span>Guardar</span>
    </button>
  </div>

  @if (savedMessage()) {
    <div class="toast-success">{{ savedMessage() }}</div>
  }

  @if (errorMessage()) {
    <div class="toast-success" style="border-color: rgba(239,68,68,.4); color: #fca5a5;">
      {{ errorMessage() }}
    </div>
  }

  <div class="settings-content">
    <div class="avatar-section">
      <div class="avatar-large">
        @if (photoUrl()) {
          <img [src]="photoUrl()" alt="Foto de perfil" style="width:100%;height:100%;object-fit:cover;border-radius:999px;">
        } @else {
          {{ initials() }}
        }
      </div>
      <div class="avatar-info">
        <h3>Foto de perfil</h3>
        <p>Imagem visível no teu perfil e publicações</p>
        <label class="change-avatar-btn" style="display:inline-flex;cursor:pointer;">
          Alterar foto
          <input type="file" accept="image/*" style="display:none;" (change)="onPhotoSelected($event)">
        </label>
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>Nome</label>
        <div class="input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" [(ngModel)]="user.name" placeholder="O teu nome">
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <div class="input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M22 7l-10 7L2 7"/>
          </svg>
          <input type="email" [(ngModel)]="user.email" placeholder="email@exemplo.com" disabled>
        </div>
        <p class="text-xs text-[var(--text-tertiary)] mt-1">O email não pode ser alterado aqui.</p>
      </div>
    </div>

    <div class="form-group full-width">
      <label>Biografia</label>
      <div class="textarea-wrapper">
        <textarea [(ngModel)]="user.bio" rows="4" maxlength="500" placeholder="Fala um pouco sobre ti..."></textarea>
        <span class="char-count">{{ user.bio.length }}/500</span>
      </div>
    </div>

    <label class="form-group full-width" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
      <input type="checkbox" [(ngModel)]="user.is_private">
      <span>Perfil privado</span>
    </label>
  </div>
</div>
