<div class="settings-page">
  <div class="settings-header">
    <button class="back-btn" (click)="goBack()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <h1>Informacao da Conta</h1>
    <button class="save-btn" (click)="saveChanges()" [class.loading]="isLoading()">
      @if (isLoading()) {
        <svg class="spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
          <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/>
        </svg>
      }
      <span>Guardar</span>
    </button>
  </div>

  @if (savedMessage()) {
    <div class="toast-success">{{ savedMessage() }}</div>
  }

  @if (errorMessage()) {
    <div class="toast-success" style="border-color: rgba(239,68,68,.4); color: #fca5a5;">
      {{ errorMessage() }}
    </div>
  }

  <div class="settings-content">
    <div class="avatar-section">
      <div class="avatar-large">
        @if (photoUrl()) {
          <img [src]="photoUrl()" alt="Foto de perfil" style="width:100%;height:100%;object-fit:cover;border-radius:999px;">
        } @else {
          {{ initials() }}
        }
      </div>
      <div class="avatar-info">
        <h3>Foto de perfil</h3>
        <p>Escolhe uma imagem para atualizar no backend</p>
        <label class="change-avatar-btn" style="display:inline-flex;cursor:pointer;">
          Alterar foto
          <input type="file" accept="image/*" style="display:none;" (change)="onPhotoSelected($event)">
        </label>
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>Nome</label>
        <div class="input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" [(ngModel)]="user.name" placeholder="O teu nome">
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <div class="input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M22 7l-10 7L2 7"/>
          </svg>
          <input type="email" [(ngModel)]="user.email" placeholder="email@exemplo.com" disabled>
        </div>
      </div>

      <div class="form-group">
        <label>Telefone</label>
        <div class="input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.574 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          <input type="tel" [(ngModel)]="user.phone" placeholder="+244 XXX XXX XXX">
        </div>
      </div>

      <div class="form-group">
        <label>Website</label>
        <div class="input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <input type="url" [(ngModel)]="user.website" placeholder="https://...">
        </div>
      </div>

      <div class="form-group">
        <label>Localizacao</label>
        <div class="input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <input type="text" [(ngModel)]="user.location" placeholder="Cidade, Pais">
        </div>
      </div>

      <div class="form-group">
        <label>Data de nascimento</label>
        <div class="input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <input type="date" [(ngModel)]="user.birthDate">
        </div>
      </div>
    </div>

    <div class="form-group full-width">
      <label>Biografia</label>
      <div class="textarea-wrapper">
        <textarea [(ngModel)]="user.bio" rows="4" maxlength="500" placeholder="Fala um pouco sobre ti..."></textarea>
        <span class="char-count">{{ user.bio.length }}/500</span>
      </div>
    </div>

    <label class="form-group full-width" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
      <input type="checkbox" [(ngModel)]="user.is_private">
      <span>Perfil privado</span>
    </label>
  </div>
</div>
