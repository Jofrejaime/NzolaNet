<div class="settings-page">
  <div class="settings-header">
    <button class="back-btn" (click)="goBack()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <h1>Segurança</h1>
  </div>

  <div class="settings-form">
    <div class="form-section">
      <h2>Alterar palavra-passe</h2>
      
      <div class="form-group">
        <label>Palavra-passe actual</label>
        <input type="password" [(ngModel)]="passwordData.currentPassword" class="form-input" placeholder="********">
      </div>

      <div class="form-group">
        <label>Nova palavra-passe</label>
        <input type="password" [(ngModel)]="passwordData.newPassword" class="form-input" placeholder="********">
      </div>

      <div class="form-group">
        <label>Confirmar nova palavra-passe</label>
        <input type="password" [(ngModel)]="passwordData.confirmPassword" class="form-input" placeholder="********">
      </div>

      <button class="update-btn" (click)="updatePassword()">Actualizar palavra-passe</button>
    </div>

    <div class="form-section">
      <div class="toggle-row">
        <div class="toggle-info">
          <h2>Autenticação de dois factores (2FA)</h2>
          <span class="toggle-desc">Adiciona uma camada extra de segurança à tua conta</span>
        </div>
        <label class="toggle">
          <input type="checkbox" [(ngModel)]="twoFactorEnabled" (change)="toggleTwoFactor()">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </label>
      </div>
    </div>
  </div>
</div>
