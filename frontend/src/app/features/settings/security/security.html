<div class="settings-page">
  <div class="settings-header">
    <button class="back-btn" (click)="goBack()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <h1>Segurança</h1>
  </div>

  @if (errorMessage()) {
    <div class="mx-4 mt-4 rounded-lg border border-red-500/40 bg-red-500/10 px-4 py-3 text-sm text-red-300">
      {{ errorMessage() }}
    </div>
  }

  <div class="settings-form">
    <div class="form-section">
      <h2>Alterar palavra-passe</h2>

      <div class="form-group">
        <label>Palavra-passe actual</label>
        <input type="password" [(ngModel)]="passwordData.currentPassword" class="form-input" placeholder="********">
      </div>

      <div class="form-group">
        <label>Nova palavra-passe</label>
        <input type="password" [(ngModel)]="passwordData.newPassword" class="form-input" placeholder="********">
      </div>

      <div class="form-group">
        <label>Confirmar nova palavra-passe</label>
        <input type="password" [(ngModel)]="passwordData.confirmPassword" class="form-input" placeholder="********">
      </div>

      <button class="update-btn" [disabled]="isSaving()" (click)="updatePassword()">
        {{ isSaving() ? 'A guardar...' : 'Actualizar palavra-passe' }}
      </button>
    </div>
  </div>
</div>
