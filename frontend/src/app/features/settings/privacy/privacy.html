<div class="settings-page">
  <div class="settings-header">
    <button class="back-btn" (click)="goBack()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <h1>Privacidade</h1>
    <button class="save-btn" [disabled]="isSaving()" (click)="saveChanges()">Guardar</button>
  </div>

  <div class="settings-form">
    <div class="toggle-group">
      <div class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-label">Conta privada</span>
          <span class="toggle-desc">Apenas seguidores aprovados veem as tuas publicações</span>
        </div>
        <label class="toggle">
          <input type="checkbox" [checked]="isPrivate()" (change)="isPrivate.set($any($event.target).checked)">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </label>
      </div>
    </div>
  </div>
</div>
