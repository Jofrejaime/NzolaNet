<div class="reset-wrap min-h-screen flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-[420px]">

    <!-- Logo -->
    <div class="flex items-center justify-center gap-2 mb-8">
      <div class="w-10 h-10 rounded-xl bg-[var(--bg-brand)] flex items-center justify-center shadow-lg">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
        </svg>
      </div>
      <span class="text-2xl font-extrabold text-[var(--text-brand)]">NzolaNet</span>
    </div>

    <div class="card bg-[var(--bg-surface)] border border-[var(--border-default)] rounded-2xl p-8">

      @if (success()) {
        <!-- Estado de sucesso -->
        <div class="text-center py-4">
          <div class="w-16 h-16 rounded-full bg-green-500/10 border border-green-500/30 flex items-center justify-center mx-auto mb-4">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5">
              <path d="M20 6L9 17l-5-5"/>
            </svg>
          </div>
          <h1 class="text-xl font-bold text-[var(--text-primary)] mb-2">Palavra-passe redefinida!</h1>
          <p class="text-sm text-[var(--text-secondary)] mb-6">A tua palavra-passe foi alterada com sucesso. Podes fazer login agora.</p>
          <button (click)="goToLogin()" class="w-full bg-[var(--bg-brand)] text-white py-3 rounded-xl font-bold text-sm hover:bg-[#C9460A] transition-all">
            Ir para o Login
          </button>
        </div>
      } @else {
        <!-- Formulário -->
        <div class="text-center mb-6">
          <div class="w-12 h-12 rounded-xl bg-[var(--bg-brand)]/10 border border-[var(--bg-brand)]/20 flex items-center justify-center mx-auto mb-3">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text-brand)" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <h1 class="text-xl font-bold text-[var(--text-primary)] mb-1">Nova Palavra-Passe</h1>
          <p class="text-sm text-[var(--text-secondary)]">Define a tua nova palavra-passe abaixo</p>
        </div>

        @if (errorMessage()) {
          <div class="mb-4 rounded-xl border border-red-500/40 bg-red-500/10 px-4 py-3 text-sm text-red-300 flex items-start gap-2">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="flex-shrink-0 mt-0.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            {{ errorMessage() }}
          </div>
        }

        <div class="flex flex-col gap-3">

          <!-- Nova palavra-passe -->
          <div>
            <label class="block text-xs font-medium text-[var(--text-secondary)] mb-1.5 ml-1">Nova palavra-passe</label>
            <div class="input-wrap flex items-center gap-3 bg-[var(--bg-elevated)] border border-[var(--border-default)] rounded-xl px-4 py-3 focus-within:border-[var(--border-brand)] transition">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-[var(--text-tertiary)] flex-shrink-0">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input
                [type]="showPassword ? 'text' : 'password'"
                [(ngModel)]="form.password"
                placeholder="Mínimo 8 caracteres"
                class="flex-1 bg-transparent border-none outline-none text-sm text-[var(--text-primary)] placeholder:text-[var(--text-tertiary)]"
              />
              <button type="button" (click)="showPassword = !showPassword" class="text-[var(--text-tertiary)] hover:text-[var(--text-secondary)] transition flex-shrink-0">
                @if (showPassword) {
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                } @else {
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                }
              </button>
            </div>
          </div>

          <!-- Confirmar palavra-passe -->
          <div>
            <label class="block text-xs font-medium text-[var(--text-secondary)] mb-1.5 ml-1">Confirmar palavra-passe</label>
            <div class="input-wrap flex items-center gap-3 bg-[var(--bg-elevated)] border border-[var(--border-default)] rounded-xl px-4 py-3 focus-within:border-[var(--border-brand)] transition">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-[var(--text-tertiary)] flex-shrink-0">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input
                [type]="showConfirm ? 'text' : 'password'"
                [(ngModel)]="form.password_confirmation"
                placeholder="Repete a palavra-passe"
                class="flex-1 bg-transparent border-none outline-none text-sm text-[var(--text-primary)] placeholder:text-[var(--text-tertiary)]"
                (keyup.enter)="submit()"
              />
              <button type="button" (click)="showConfirm = !showConfirm" class="text-[var(--text-tertiary)] hover:text-[var(--text-secondary)] transition flex-shrink-0">
                @if (showConfirm) {
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                } @else {
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                }
              </button>
            </div>
          </div>

          <button
            (click)="submit()"
            [disabled]="isLoading()"
            class="w-full flex items-center justify-center gap-2 bg-[var(--bg-brand)] text-white py-3 rounded-xl font-bold text-sm hover:bg-[#C9460A] transition-all hover:scale-[1.01] active:scale-[0.99] mt-1 disabled:opacity-60"
          >
            @if (isLoading()) {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="animate-spin"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
              A redefinir...
            } @else {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
              Redefinir Palavra-Passe
            }
          </button>

          <button (click)="goToLogin()" class="text-sm text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition text-center mt-1">
            ← Voltar ao Login
          </button>

        </div>
      }

    </div>

    <div class="text-center mt-6 text-xs text-[var(--text-tertiary)]">
      © 2026 NzolaNet · <a href="#" class="hover:underline">Privacidade</a> · <a href="#" class="hover:underline">Termos</a>
    </div>

  </div>
</div>
